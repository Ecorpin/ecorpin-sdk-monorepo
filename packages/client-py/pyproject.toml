[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecorpin-client"
version = "0.1.0"
description = "Turns N Ecorpin services' metadata into one fluent SDK (sdk.crm.users.list()). Handles discovery, caching, auth, retries, timeouts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Ecorpin" }]
keywords = ["ecorpin", "sdk", "service-sdk", "internal-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28,<3"]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.24"]

[project.urls]
Homepage = "https://github.com/Ecorpin/ecorpin-sdk-monorepo/tree/master/packages/client-py"
Repository = "https://github.com/Ecorpin/ecorpin-sdk-monorepo"

[tool.hatch.build.targets.wheel]
packages = ["src/ecorpin_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
