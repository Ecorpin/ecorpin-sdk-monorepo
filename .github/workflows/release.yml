name: Release

# Standard Changesets flow:
# 1. PRs land on `master` with a changeset file (created via `npm run changeset`).
# 2. This workflow then opens/updates a "Version Packages" PR that applies the
#    version bumps + changelogs (via `changesets/action`, which runs our
#    `npm run version` script under the hood).
# 3. Merging that "Version Packages" PR triggers this workflow again; since no
#    changesets remain, it runs `npm run release` instead, which builds, tests,
#    and publishes every changed package to the npm registry, then tags the
#    commit (e.g. @ecorpin/core@0.2.0).
#
# Required repo secret:
#   NPM_TOKEN — an npm automation token with publish rights to the @ecorpin scope.
#   (GITHUB_TOKEN is provided automatically by Actions and needs no setup.)

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create Version PR or Publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
