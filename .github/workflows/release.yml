name: Release

# Standard Changesets flow:
# 1. PRs land on `master` with a changeset file (created via `npm run changeset`).
# 2. This workflow then opens/updates a "Version Packages" PR that applies the
#    version bumps + changelogs (via `changesets/action`, which runs our
#    `npm run version` script under the hood).
# 3. Merging that "Version Packages" PR triggers this workflow again; since no
#    changesets remain, it runs `changeset publish`, which builds, tests, and
#    publishes every changed package to the npm registry, then tags the
#    commit (e.g. @ecorpin/core@0.2.0).
#
# Auth: this workflow has `id-token: write`, so changesets/action authenticates
# to npm via OIDC "Trusted Publishing" — no NPM_TOKEN secret needed. BUT npm
# does not allow OIDC publishing for a package's very first version; the
# package must already exist before you can register a trusted publisher for
# it. One-time bootstrap required before this workflow can publish anything:
#   1. Ensure the `ecorpin` scope/org exists on npmjs.com.
#   2. From a machine logged in via `npm login`, run `npm run release` once
#      to publish the initial versions manually.
#   3. On npmjs.com, open each package's Settings > Trusted Publisher and
#      register: org/user "Ecorpin", repo "ecorpin-sdk-monorepo", workflow
#      filename "release.yml", allowed action "npm publish".
# After that one-time setup, every subsequent publish from this workflow
# authenticates automatically via OIDC.

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      # Node 20 (pinned via .nvmrc to match runtime `engines`) bundles an npm
      # CLI too old to speak the OIDC Trusted Publishing protocol (needs npm
      # >=11.5.1). Pinned to the 11.x line rather than `@latest`: npm 12
      # dropped Node 20 support entirely (engines.node: ^22.22.2 || ...),
      # which makes `npm install -g npm@latest` fail with EBADENGINE on this
      # Node-20 runner. Every npm 11.x release supports both Node
      # ^20.17.0 and OIDC (>=11.5.1), so this restores publishing without
      # bumping the runner off Node 20.
      - name: Use npm 11.x (required for OIDC trusted publishing on Node 20)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create Version PR or Publish to npm
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
